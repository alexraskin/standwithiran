# Documented victims profiled on /victims/, grouped by `group`
# (VICTIM_GROUPS in src/lib/content-schema.ts), in date order within a group.
# Only add people documented by an independent organisation; `url` must be
# that organisation's own record for the person. No photographs.
- id: mahsa-jina-amini
  name: "Mahsa (Jina) Amini"
  name_fa: "مهسا (ژینا) امینی"
  age: 22
  place: "Tehran"
  date: "2022-09-16"
  summary: "A Kurdish woman from Saqqez, arrested by the morality police in Tehran on 13 September 2022 over her hijab. She fell into a coma in custody and died three days later. Her death sparked the Woman, Life, Freedom uprising."
  source: "Abdorrahman Boroumand Center"
  url: "https://www.iranrights.org/memorial/story/-8952/mahsa-jina-amini"
  group: uprising_2022
- id: minoo-majidi
  name: "Minoo Majidi"
  name_fa: "مینو مجیدی"
  age: 62
  place: "Kermanshah"
  date: "2022-09-20"
  summary: "A mother from Kermanshah, shot by security forces while taking part in protests on 20 September 2022."
  source: "Abdorrahman Boroumand Center"
  url: "https://www.iranrights.org/memorial/story/-8587/minu-majidi"
  group: uprising_2022
- id: nika-shakarami
  name: "Nika Shakarami"
  name_fa: "نیکا شاکرمی"
  age: 16
  place: "Tehran"
  date: "2022-09-21"
  summary: "From Khorramabad, living in Tehran, where she worked in a café and studied painting. She disappeared after joining protests on 20 September 2022. Her family identified her body nine days later; her burial certificate records multiple injuries from blows with a hard object."
  source: "Abdorrahman Boroumand Center"
  url: "https://www.iranrights.org/memorial/story/-8756/nika-shakarami"
  group: uprising_2022
- id: sarina-esmailzadeh
  name: "Sarina Esmailzadeh"
  name_fa: "سارینا اسماعیل‌زاده"
  age: 16
  place: "Karaj"
  date: "2022-09-23"
  summary: "A student in Mehrshahr, Karaj, who posted videos criticising compulsory hijab. She died on 23 September 2022 after baton blows to the head during protests. Officials claimed she had fallen from a height."
  source: "Abdorrahman Boroumand Center"
  url: "https://www.iranrights.org/memorial/story/-9000/sarina-esmailzadeh"
  group: uprising_2022
- id: kian-pirfalak
  name: "Kian Pirfalak"
  name_fa: "کیان پیرفلک"
  age: 9
  place: "Izeh"
  date: "2022-11-16"
  summary: "A boy from Izeh who dreamed of becoming a robotics engineer. On 16 November 2022, security forces opened fire on his family's car. He was killed instantly and his father was seriously wounded."
  source: "Abdorrahman Boroumand Center"
  url: "https://www.iranrights.org/memorial/story/-8953/kian-pirfalak"
  group: uprising_2022
- id: mohsen-shekari
  name: "Mohsen Shekari"
  name_fa: "محسن شکاری"
  age: 23
  place: "Tehran"
  date: "2022-12-08"
  summary: "A café worker in Tehran, arrested on 25 September 2022 after blocking a street during protests. Convicted of moharebeh, waging war against God, he was hanged on 8 December 2022, the first protester executed."
  source: "Abdorrahman Boroumand Center"
  url: "https://www.iranrights.org/memorial/story/-8734/mohsen-shekari"
  group: executed
- id: majidreza-rahnavard
  name: "Majidreza Rahnavard"
  name_fa: "مجیدرضا رهنورد"
  age: 23
  place: "Mashhad"
  date: "2022-12-12"
  summary: "Publicly hanged from a crane in Mashhad on 12 December 2022, 23 days after his arrest, after a trial human rights groups called a sham. His mother was not told until after his death."
  source: "Index on Censorship"
  url: "https://www.indexoncensorship.org/2023/01/in-memory-of-the-executed-four-men-following-unfair-show-trials-after-the-jina-mahsa-amini-protests-in-iran/"
  group: executed
- id: mohammad-mehdi-karami
  name: "Mohammad Mehdi Karami"
  name_fa: "محمدمهدی کرمی"
  age: 22
  place: "Karaj"
  date: "2023-01-07"
  summary: "A Kurdish karate champion from Karaj and a member of Iran's national team. Convicted over the killing of a Basij member during protests and denied a lawyer of his choice, he was hanged on 7 January 2023."
  source: "Abdorrahman Boroumand Center"
  url: "https://www.iranrights.org/memorial/story/-8588/mohammad-mehdi-karami"
  group: executed
- id: seyed-mohammad-hosseini
  name: "Seyed Mohammad Hosseini"
  name_fa: "سید محمد حسینی"
  place: "Karaj"
  date: "2023-01-07"
  summary: "A worker and former martial arts champion from Karaj who volunteered as a children's coach. Convicted in the same case as Mohammad Mehdi Karami, he said his confession was extracted under torture. He was hanged on 7 January 2023. Both his parents had died, and no one visited him in prison."
  source: "Abdorrahman Boroumand Center"
  url: "https://www.iranrights.org/memorial/story/-8592/seyed-mohammad-hosseini"
  group: executed
- id: amirreza-fathian
  name: "Amirreza Fathian"
  name_fa: "امیررضا فتحیان"
  age: 40
  place: "Isfahan"
  date: "2026-01-08"
  summary: "A mining engineer from Isfahan, married. He was shot in the heart with live ammunition during protests on 8 January 2026. Security agencies pressured his family to portray him as a 'security martyr'; the family refused."
  source: "Hengaw Organization for Human Rights"
  url: "https://hengaw.org/en/content/article-39322"
  group: protests_2025_26
- id: alireza-yazdani
  name: "Alireza Yazdani"
  name_fa: "علیرضا یزدانی"
  age: 19
  place: "Isfahan"
  date: "2026-01-08"
  summary: "A web designer and computer science student from Falavarjan, living in Isfahan. He was shot in the head by government forces on 8 January 2026. His body was withheld for a week before it was released to his family."
  source: "Hengaw Organization for Human Rights"
  url: "https://hengaw.org/en/content/article-39322"
  group: protests_2025_26
- id: nazanin-zahra-salehi
  name: "Nazanin Zahra Salehi"
  name_fa: "نازنین زهرا صالحی"
  age: 13
  place: "Kermanshah"
  date: "2026-01-09"
  summary: "A 13-year-old girl from Kermanshah, shot dead at close range by government forces in a public park on 9 January 2026, during the crackdown on the protests that began in late December 2025."
  source: "Hengaw Organization for Human Rights"
  url: "https://hengaw.org/en/content/article-39319"
  group: protests_2025_26
