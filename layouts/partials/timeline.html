<ol class="timeline">
{{ range . }}{{ $page := . }}<li id="{{ .File.ContentBaseName }}"><span class="timeline-year">{{ partial "digits.html" .Params.year }}</span><div><h3><a href="{{ .RelPermalink }}">{{ .Title }}</a></h3>{{ .Summary }}{{ with $page.Params.source_url }}<p><a href="{{ . }}">{{ $page.Params.source }}</a></p>{{ end }}</div></li>{{ end }}
</ol>
